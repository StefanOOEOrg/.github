name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-ok-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # The tools use the standard library only, so there is nothing to install for them and no
      # pyproject.toml or lock file in this repository: it is not a package. ruff and pytest come
      # through uvx, at the same commands a developer runs by hand.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Shell syntax
        run: bash -n tools/github-watch.sh tools/dev-dispatch.sh tools/install.sh
      - name: Lint
        run: uvx ruff@0.17 check --config tools/ruff.toml .
      - name: Pylint (loop engine)
        run: cd tools && uvx --with pytest pylint==4.1.3 --max-line-length=100 loop
      - name: Tests
        run: uvx --with pytest pytest tools/ -q
  # Aggregate gate: one required check for every job of this workflow.
  # A separate job instead of a matrix check because the ruleset name must stay stable.
  ci-ok:
    needs: [ci-ok-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all jobs succeeded
        run: |
          echo "test: ${{ needs.ci-ok-test.result }} "
          [ "${{ needs.ci-ok-test.result }}" = "success" ]
