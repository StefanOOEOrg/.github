<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 565" width="1230" height="565" role="img" aria-label="Architecture of The Loop: GitHub, Tailscale Funnel, the loop listener with its signal sources, dispatcher, engine and output sink, and the Hermes profile">
<title>Architecture of The Loop</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;fill:#e6edf3;text-anchor:middle}
.kick{font-size:10.5px;font-weight:600;letter-spacing:1.1px}
.gk{font-size:11px;font-weight:700;letter-spacing:1.4px;text-anchor:start}
.title{font-size:17px;font-weight:700}
.sub{font-size:12.5px;fill:#9198a1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lbl{font-size:12.5px;fill:#9198a1}
.b{fill:#161b22;stroke-width:1.6}
.red{stroke:#f0596b}.gh{stroke:#3fb950}.hm{stroke:#58a6ff}.ours{stroke:#f0883e;stroke-width:2.2}.infra{stroke:#9198a1}
.k-red{fill:#f0596b}.k-gh{fill:#3fb950}.k-hm{fill:#58a6ff}.k-ours{fill:#f0883e}.k-infra{fill:#9198a1}
.frame{stroke-width:1.2;stroke-dasharray:none}
.f-gh{fill:#3fb950;fill-opacity:0.08;stroke:#3fb950}
.f-hm{fill:#58a6ff;fill-opacity:0.08;stroke:#58a6ff}
.f-ours{fill:#f0883e;fill-opacity:0.08;stroke:#f0883e}
path{fill:none;stroke-width:1.8}.a{stroke:#9198a1}.r{stroke:#f0596b;stroke-width:2.2}
.j{stroke:#9198a1}
</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#9198a1;stroke:none"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#f0596b;stroke:none"/></marker></defs>
<rect class="frame f-gh" x="195" y="74" width="220" height="436" rx="16"/>
<text class="gk k-gh" x="211" y="98">GITHUB</text>
<rect class="frame f-ours" x="622" y="74" width="286" height="450" rx="16"/>
<text class="gk k-ours" x="638" y="515">LOOP-LISTENER · SYSTEMD</text>
<rect class="frame f-hm" x="935" y="74" width="270" height="436" rx="16"/>
<text class="gk k-hm" x="951" y="98">HERMES · PROFILE SW-LEAD</text>
<rect class="b red" x="20" y="108" width="140" height="104" rx="12"/><text class="kick k-red" x="90" y="129">HUMAN</text><text class="title" x="90" y="151">Product owner</text><text class="sub" x="90" y="170">pulls cards to Goal,</text><text class="sub" x="90" y="186">approves</text>
<rect class="b gh" x="215" y="118" width="180" height="84" rx="12"/><text class="kick k-gh" x="305" y="139">PROJECT</text><text class="title" x="305" y="161">“The Loop”</text><text class="sub" x="305" y="180">Status field</text>
<rect class="b gh" x="215" y="258" width="180" height="84" rx="12"/><text class="kick k-gh" x="305" y="279">CODE</text><text class="title" x="305" y="301">Repositories</text><text class="sub" x="305" y="320">issues · PRs · reviews</text>
<rect class="b gh" x="215" y="400" width="180" height="84" rx="12"/><text class="kick k-gh" x="305" y="421">ORG WEBHOOK</text><text class="title" x="305" y="443">5 events</text><text class="sub" x="305" y="462">HMAC-signed</text>
<rect class="b infra" x="450" y="400" width="140" height="84" rx="12"/><text class="kick k-infra" x="520" y="421">TAILSCALE</text><text class="title" x="520" y="443">Funnel</text><text class="sub" x="520" y="462">one path only</text>
<rect class="b ours" x="640" y="118" width="117" height="84" rx="12"/><text class="kick k-ours" x="698.5" y="139">ENGINE</text><text class="title" x="698.5" y="161">Loop engine</text><text class="sub" x="698.5" y="180"><tspan class="mono">run_scope</tspan></text>
<rect class="b ours" x="773" y="118" width="117" height="84" rx="12"/><text class="kick k-ours" x="831.5" y="139">OUTPUT SINK</text><text class="title" x="831.5" y="161">Sink adapter</text><text class="sub" x="831.5" y="180"><tspan class="mono">LOOP_SINK</tspan></text>
<rect class="b ours" x="640" y="258" width="250" height="84" rx="12"/><text class="kick k-ours" x="765" y="279">QUEUE + DISPATCHER</text><text class="title" x="765" y="301">Signal → one run</text><text class="sub" x="765" y="320">serial · event time · retry</text>
<rect class="b ours" x="640" y="386" width="250" height="110" rx="12"/><text class="kick k-ours" x="765" y="407">SIGNAL SOURCES</text><text class="title" x="765" y="429">Source adapters</text><text class="sub" x="765" y="448">webhook · timer · jobwatch</text><text class="sub" x="765" y="464"><tspan class="mono">LOOP_SOURCES</tspan></text>
<rect class="b hm" x="950" y="118" width="240" height="84" rx="12"/><text class="kick k-hm" x="1070" y="139">DEVELOPER AGENT</text><text class="title" x="1070" y="161">Dev job</text><text class="sub" x="1070" y="180">one-shot job per card</text>
<rect class="b hm" x="950" y="258" width="240" height="84" rx="12"/><text class="kick k-hm" x="1070" y="279">CRON</text><text class="title" x="1070" y="301">“loop-deliver”</text><text class="sub" x="1070" y="320">outbox → Bot Chat</text>
<rect class="b hm" x="950" y="400" width="240" height="84" rx="12"/><text class="kick k-hm" x="1070" y="421">LEAD AGENT</text><text class="title" x="1070" y="443">Lead</text><text class="sub" x="1070" y="462">refine · review · merge</text>
