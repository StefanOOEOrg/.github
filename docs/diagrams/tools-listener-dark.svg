<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1035 632" width="1035" height="632" role="img" aria-label="The webhook listener: the GitHub org webhook reaches it through Tailscale Funnel; the HTTP thread checks and queues, the start and the clock add full runs, the dispatcher runs the engine one run at a time, the delivery thread hands each message to the Hermes cron loop-deliver, which delivers it to the Lead">
<title>The webhook listener</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;fill:#e6edf3;text-anchor:middle}
.kick{font-size:10.5px;font-weight:600;letter-spacing:1.1px}
.gk{font-size:11px;font-weight:700;letter-spacing:1.4px;text-anchor:start}
.title{font-size:17px;font-weight:700}
.sub{font-size:12.5px;fill:#9198a1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lbl{font-size:12.5px;fill:#9198a1}
.num{font-weight:700;fill:#e6edf3}
.start{text-anchor:start}.end{text-anchor:end}
.halo{paint-order:stroke;stroke:#0d1117;stroke-width:3.5px;stroke-linejoin:round}
.b{fill:#161b22;stroke-width:1.6}
.red{stroke:#f0596b}.gh{stroke:#3fb950}.hm{stroke:#58a6ff}.ours{stroke:#f0883e;stroke-width:2.2}.infra{stroke:#9198a1}
.patch{stroke-dasharray:6 4}
.k-red{fill:#f0596b}.k-gh{fill:#3fb950}.k-hm{fill:#58a6ff}.k-ours{fill:#f0883e}.k-infra{fill:#9198a1}
.frame{stroke-width:1.2}
.f-gh{fill:#3fb950;fill-opacity:0.08;stroke:#3fb950}
.f-hm{fill:#58a6ff;fill-opacity:0.08;stroke:#58a6ff}
.f-ours{fill:#f0883e;fill-opacity:0.08;stroke:#f0883e}
.f-infra{fill:#9198a1;fill-opacity:0.08;stroke:#9198a1}
.note{fill:#21262d;stroke:#3d444d;stroke-width:1.2}
path{fill:none;stroke-width:1.8}.a{stroke:#9198a1}.r{stroke:#f0596b;stroke-width:2.2}
.d{stroke-dasharray:6 5}.life{stroke:#3d444d;stroke-width:1.5;stroke-dasharray:4 4}
</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#9198a1;stroke:none"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#f0596b;stroke:none"/></marker></defs>
<rect class="b gh" x="20" y="20" width="170" height="84" rx="12"/>
<text class="kick k-gh" x="105.0" y="41.0">GITHUB</text>
<text class="title" x="105.0" y="63.0">Org webhook</text>
<text class="sub" x="105.0" y="82.0">HMAC-signed</text>
<rect class="b infra" x="20" y="150" width="170" height="100" rx="12"/>
<text class="kick k-infra" x="105.0" y="179.0">TAILSCALE</text>
<text class="title" x="105.0" y="201.0">Funnel</text>
<text class="sub" x="105.0" y="220.0">one path only</text>
<rect class="frame f-ours" x="225" y="106" width="790" height="304" rx="16"/>
<text class="gk k-ours" x="241" y="130">LOOP-LISTENER · ONE PROCESS · SYSTEMD</text>
<rect class="b ours" x="245" y="150" width="230" height="100" rx="12"/>
<text class="kick k-ours" x="360.0" y="171.0">HTTP THREAD</text>
<text class="title" x="360.0" y="193.0">Receive</text>
<text class="sub" x="360.0" y="212.0">HMAC · route filter · dedupe</text>
<text class="sub" x="360.0" y="228.0">202 at once</text>
<rect class="b ours" x="505" y="150" width="230" height="100" rx="12"/>
<text class="kick k-ours" x="620.0" y="179.0">IN-MEMORY QUEUE</text>
<text class="title" x="620.0" y="201.0">Queue</text>
<text class="sub" x="620.0" y="220.0">by event time</text>
<rect class="b ours" x="765" y="150" width="230" height="100" rx="12"/>
<text class="kick k-ours" x="880.0" y="179.0">DISPATCHER</text>
<text class="title" x="880.0" y="201.0">One run at a time</text>
<text class="sub" x="880.0" y="220.0"><tspan class="mono">tick.run_scope</tspan>, in-process</text>
<rect class="b ours" x="245" y="290" width="230" height="100" rx="12"/>
<text class="kick k-ours" x="360.0" y="311.0">START + CLOCK</text>
<text class="title" x="360.0" y="333.0">Full run</text>
<text class="sub" x="360.0" y="352.0">at start, then every</text>
<text class="sub" x="360.0" y="368.0"><tspan class="mono">LOOP_FULL_RUN_MINUTES</tspan></text>
<rect class="b ours" x="505" y="290" width="230" height="100" rx="12"/>
<text class="kick k-ours" x="620.0" y="319.0">DELIVERY THREAD</text>
<text class="title" x="620.0" y="341.0">Deliver</text>
<text class="sub" x="620.0" y="360.0"><tspan class="mono">LOOP_DELIVER_CMD</tspan></text>
<rect class="b ours" x="765" y="290" width="230" height="100" rx="12"/>
<text class="kick k-ours" x="880.0" y="319.0">DELIVERY QUEUE</text>
<text class="title" x="880.0" y="341.0">Messages</text>
<text class="sub" x="880.0" y="360.0">in order</text>
<rect class="frame f-hm" x="485" y="440" width="530" height="172" rx="16"/>
<text class="gk k-hm" x="501" y="603">HERMES · PROFILE SW-LEAD</text>
<rect class="b hm" x="505" y="470" width="230" height="100" rx="12"/>
<text class="kick k-hm" x="620.0" y="499.0">CRON</text>
<text class="title" x="620.0" y="521.0">“loop-deliver”</text>
<text class="sub" x="620.0" y="540.0"><tspan class="mono">--deliver bot-chat:sw-lead</tspan></text>
<rect class="b hm" x="765" y="470" width="230" height="100" rx="12"/>
<text class="kick k-hm" x="880.0" y="499.0">LEAD AGENT</text>
<text class="title" x="880.0" y="521.0">Lead</text>
<text class="sub" x="880.0" y="540.0">turn in Bot Chat</text>
<path class="a" d="M105,104 V146" marker-end="url(#ma)"/>
<path class="a" d="M190,200 H241" marker-end="url(#ma)"/>
<path class="a" d="M475,200 H501" marker-end="url(#ma)"/>
<path class="a" d="M735,200 H761" marker-end="url(#ma)"/>
<path class="a" d="M880,250 V286" marker-end="url(#ma)"/>
<path class="a" d="M765,340 H739" marker-end="url(#ma)"/>
<path class="a" d="M475,340 H490 V230 H501" marker-end="url(#ma)"/>
<path class="a" d="M620,390 V466" marker-end="url(#ma)"/>
<path class="a" d="M735,520 H761" marker-end="url(#ma)"/>
<text class="lbl start halo" x="632" y="429">outbox + <tspan class="mono">hermes cron run</tspan></text>
</svg>
