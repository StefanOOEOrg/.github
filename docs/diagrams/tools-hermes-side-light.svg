<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 784" width="1015" height="784" role="img" aria-label="The Hermes side: the GitHub org webhook passes the gateway's webhook adapter, route filters, cron trigger, job claim, external worker and no-agent job into loop-tick.sh; its stdout goes through the Bot Chat delivery, the queue watch and the drain to a Lead turn; dashed cards are the local patch">
<title>The Hermes side of a loop event</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;fill:#1f2328;text-anchor:middle}
.kick{font-size:10.5px;font-weight:600;letter-spacing:1.1px}
.gk{font-size:11px;font-weight:700;letter-spacing:1.4px;text-anchor:start}
.title{font-size:17px;font-weight:700}
.sub{font-size:12.5px;fill:#59636e}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lbl{font-size:12.5px;fill:#59636e}
.num{font-weight:700;fill:#1f2328}
.start{text-anchor:start}.end{text-anchor:end}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round}
.b{fill:#ffffff;stroke-width:1.6}
.red{stroke:#c8102e}.gh{stroke:#1a7f37}.hm{stroke:#0969da}.ours{stroke:#bc4c00;stroke-width:2.2}.infra{stroke:#6e7781}
.patch{stroke-dasharray:6 4}
.k-red{fill:#c8102e}.k-gh{fill:#1a7f37}.k-hm{fill:#0969da}.k-ours{fill:#bc4c00}.k-infra{fill:#6e7781}
.frame{stroke-width:1.2}
.f-gh{fill:#1a7f37;fill-opacity:0.05;stroke:#1a7f37}
.f-hm{fill:#0969da;fill-opacity:0.05;stroke:#0969da}
.f-ours{fill:#bc4c00;fill-opacity:0.05;stroke:#bc4c00}
.f-infra{fill:#6e7781;fill-opacity:0.05;stroke:#6e7781}
.note{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
path{fill:none;stroke-width:1.8}.a{stroke:#6e7781}.r{stroke:#c8102e;stroke-width:2.2}
.d{stroke-dasharray:6 5}.life{stroke:#d0d7de;stroke-width:1.5;stroke-dasharray:4 4}
</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#6e7781;stroke:none"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#c8102e;stroke:none"/></marker></defs>
<rect class="b gh" x="225" y="20" width="230" height="84" rx="12"/>
<text class="kick k-gh" x="340.0" y="41.0">GITHUB</text>
<text class="title" x="340.0" y="63.0">Org webhook</text>
<text class="sub" x="340.0" y="82.0">HMAC-signed</text>
<rect class="frame f-hm" x="205" y="134" width="790" height="510" rx="16"/>
<text class="gk k-hm" x="221" y="635">HERMES GATEWAY · NAMES FROM THE CODE · DASHED = LOCAL PATCH</text>
<rect class="b hm" x="225" y="176" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="340.0" y="197.0">RECEIVE</text>
<text class="title" x="340.0" y="219.0">Webhook adapter</text>
<text class="sub" x="340.0" y="238.0"><tspan class="mono">WebhookAdapter</tspan></text>
<text class="sub" x="340.0" y="254.0"><tspan class="mono">._handle_webhook</tspan></text>
<text class="sub" x="340.0" y="270.0">HMAC · idempotency cache</text>
<rect class="b hm" x="485" y="176" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="600.0" y="205.0">FILTER</text>
<text class="title" x="600.0" y="227.0">Route filters</text>
<text class="sub" x="600.0" y="246.0">payload filters per route</text>
<text class="sub" x="600.0" y="262.0"><tspan class="mono">webhook_subscriptions.json</tspan></text>
<rect class="b hm patch" x="745" y="176" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="860.0" y="205.0">TRIGGER · LOCAL PATCH</text>
<text class="title" x="860.0" y="227.0">Cron trigger</text>
<text class="sub" x="860.0" y="246.0"><tspan class="mono">_handle_cron_trigger</tspan></text>
<text class="sub" x="860.0" y="262.0">+ <tspan class="mono">cron_job_on_busy</tspan>: coalesce</text>
<rect class="b hm" x="745" y="332" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="860.0" y="361.0">CLAIM</text>
<text class="title" x="860.0" y="383.0">Execute job</text>
<text class="sub" x="860.0" y="402.0"><tspan class="mono">execute_job_for_event</tspan></text>
<text class="sub" x="860.0" y="418.0">→ <tspan class="mono">claim_job_for_fire</tspan></text>
<rect class="b hm patch" x="485" y="332" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="600.0" y="361.0">WORKER · LOCAL PATCH</text>
<text class="title" x="600.0" y="383.0">External worker</text>
<text class="sub" x="600.0" y="402.0"><tspan class="mono">_launch_external_cron_worker</tspan></text>
<text class="sub" x="600.0" y="418.0">+ carries the event context</text>
<rect class="b hm patch" x="225" y="332" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="340.0" y="353.0">RUN · LOCAL PATCH</text>
<text class="title" x="340.0" y="375.0">No-agent job</text>
<text class="sub" x="340.0" y="394.0"><tspan class="mono">run_job</tspan> → <tspan class="mono">_run_no_agent_job</tspan></text>
<text class="sub" x="340.0" y="410.0">+ <tspan class="mono">HERMES_CRON_EVENT</tspan></text>
<text class="sub" x="340.0" y="426.0">for the script</text>
<rect class="b hm patch" x="225" y="488" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="340.0" y="509.0">DELIVER · LOCAL PATCH</text>
<text class="title" x="340.0" y="531.0">Bot Chat delivery</text>
<text class="sub" x="340.0" y="550.0"><tspan class="mono">_deliver_to_bot_chat</tspan></text>
<text class="sub" x="340.0" y="566.0">+ defer to</text>
<text class="sub" x="340.0" y="582.0"><tspan class="mono">cron/bot_chat_pending</tspan></text>
<rect class="b hm patch" x="485" y="488" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="600.0" y="509.0">WATCH · LOCAL PATCH</text>
<text class="title" x="600.0" y="531.0">Queue watch</text>
<text class="sub" x="600.0" y="550.0"><tspan class="mono">DeliveryQueueWatch</tspan></text>
<text class="sub" x="600.0" y="566.0">+ also watches</text>
<text class="sub" x="600.0" y="582.0"><tspan class="mono">bot_chat_pending</tspan>, 1 s</text>
<rect class="b hm" x="745" y="488" width="230" height="116" rx="12"/>
<text class="kick k-hm" x="860.0" y="517.0">DRAIN</text>
<text class="title" x="860.0" y="539.0">Drain</text>
<text class="sub" x="860.0" y="558.0"><tspan class="mono">drain_in_background</tspan></text>
<text class="sub" x="860.0" y="574.0">→ <tspan class="mono">_drain</tspan></text>
<rect class="b ours" x="20" y="332" width="150" height="116" rx="12"/>
<text class="kick k-ours" x="95.0" y="369.0">SCRIPT</text>
<text class="title" x="95.0" y="391.0">Loop engine</text>
<text class="sub" x="95.0" y="410.0"><tspan class="mono">loop-tick.sh</tspan></text>
<rect class="b hm" x="745" y="680" width="230" height="84" rx="12"/>
<text class="kick k-hm" x="860.0" y="701.0">LEAD AGENT</text>
<text class="title" x="860.0" y="723.0">Lead</text>
<text class="sub" x="860.0" y="742.0">turn in Bot Chat</text>
<path class="a" d="M340,104 V172" marker-end="url(#ma)"/>
<path class="a" d="M455,234 H481" marker-end="url(#ma)"/>
<path class="a" d="M715,234 H741" marker-end="url(#ma)"/>
<path class="a" d="M860,292 V328" marker-end="url(#ma)"/>
<path class="a" d="M745,390 H719" marker-end="url(#ma)"/>
<path class="a" d="M485,390 H459" marker-end="url(#ma)"/>
<path class="a" d="M225,390 H174" marker-end="url(#ma)"/>
<path class="a" d="M455,546 H481" marker-end="url(#ma)"/>
<path class="a" d="M715,546 H741" marker-end="url(#ma)"/>
<path class="a" d="M860,604 V676" marker-end="url(#ma)"/>
<path class="a" d="M95,448 V546 H221" marker-end="url(#ma)"/>
<text class="lbl end halo" x="87" y="500">stdout</text>
</svg>
