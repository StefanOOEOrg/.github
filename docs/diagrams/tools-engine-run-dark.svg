<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 895 680" width="895" height="680" role="img" aria-label="One run of the loop engine: a Hermes webhook trigger or the hourly run starts it; inside tools/loop, under one lock, it scopes, reads GitHub, decides, diffs, executes the differences on GitHub and notifies the Lead through Hermes">
<title>One run of the loop engine</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;fill:#e6edf3;text-anchor:middle}
.kick{font-size:10.5px;font-weight:600;letter-spacing:1.1px}
.gk{font-size:11px;font-weight:700;letter-spacing:1.4px;text-anchor:start}
.title{font-size:17px;font-weight:700}
.sub{font-size:12.5px;fill:#9198a1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lbl{font-size:12.5px;fill:#9198a1}
.num{font-weight:700;fill:#e6edf3}
.start{text-anchor:start}.end{text-anchor:end}
.halo{paint-order:stroke;stroke:#0d1117;stroke-width:3.5px;stroke-linejoin:round}
.b{fill:#161b22;stroke-width:1.6}
.red{stroke:#f0596b}.gh{stroke:#3fb950}.hm{stroke:#58a6ff}.ours{stroke:#f0883e;stroke-width:2.2}.infra{stroke:#9198a1}
.patch{stroke-dasharray:6 4}
.k-red{fill:#f0596b}.k-gh{fill:#3fb950}.k-hm{fill:#58a6ff}.k-ours{fill:#f0883e}.k-infra{fill:#9198a1}
.frame{stroke-width:1.2}
.f-gh{fill:#3fb950;fill-opacity:0.08;stroke:#3fb950}
.f-hm{fill:#58a6ff;fill-opacity:0.08;stroke:#58a6ff}
.f-ours{fill:#f0883e;fill-opacity:0.08;stroke:#f0883e}
.f-infra{fill:#9198a1;fill-opacity:0.08;stroke:#9198a1}
.note{fill:#21262d;stroke:#3d444d;stroke-width:1.2}
path{fill:none;stroke-width:1.8}.a{stroke:#9198a1}.r{stroke:#f0596b;stroke-width:2.2}
.d{stroke-dasharray:6 5}.life{stroke:#3d444d;stroke-width:1.5;stroke-dasharray:4 4}
</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#9198a1;stroke:none"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:#f0596b;stroke:none"/></marker></defs>
<rect class="b hm" x="40" y="20" width="280" height="84" rx="12"/>
<text class="kick k-hm" x="180.0" y="41.0">HERMES CRON</text>
<text class="title" x="180.0" y="63.0">Webhook trigger</text>
<text class="sub" x="180.0" y="82.0">with <tspan class="mono">HERMES_CRON_EVENT</tspan></text>
<rect class="b hm" x="350" y="20" width="280" height="84" rx="12"/>
<text class="kick k-hm" x="490.0" y="41.0">HERMES CRON</text>
<text class="title" x="490.0" y="63.0">Hourly run</text>
<text class="sub" x="490.0" y="82.0">no event: the whole board</text>
<rect class="frame f-ours" x="20" y="140" width="630" height="520" rx="16"/>
<text class="gk k-ours" x="36" y="651">TOOLS/LOOP · ONE LOCK PER RUN</text>
<rect class="b ours" x="40" y="184" width="280" height="116" rx="12"/>
<text class="kick k-ours" x="180.0" y="205.0">1 · SCOPE</text>
<text class="title" x="180.0" y="227.0">Scope</text>
<text class="sub" x="180.0" y="246.0">event → one card</text>
<text class="sub" x="180.0" y="262.0">or the whole board</text>
<text class="sub" x="180.0" y="278.0"><tspan class="mono">scope.py</tspan></text>
<rect class="b ours" x="350" y="184" width="280" height="116" rx="12"/>
<text class="kick k-ours" x="490.0" y="213.0">2 · READ</text>
<text class="title" x="490.0" y="235.0">Read</text>
<text class="sub" x="490.0" y="254.0">one GraphQL query per scope</text>
<text class="sub" x="490.0" y="270.0"><tspan class="mono">github_client.py</tspan> → <tspan class="mono">model.py</tspan></text>
<rect class="b ours" x="350" y="344" width="280" height="116" rx="12"/>
<text class="kick k-ours" x="490.0" y="365.0">3 · DECIDE</text>
<text class="title" x="490.0" y="387.0">Decide</text>
<text class="sub" x="490.0" y="406.0">pure rules: status, assignee,</text>
<text class="sub" x="490.0" y="422.0">dispatch, notices, checks</text>
<text class="sub" x="490.0" y="438.0"><tspan class="mono">rules/</tspan> · <tspan class="mono">engine.py</tspan></text>
<rect class="b ours" x="40" y="344" width="280" height="116" rx="12"/>
<text class="kick k-ours" x="180.0" y="373.0">4 · DIFF</text>
<text class="title" x="180.0" y="395.0">Diff</text>
<text class="sub" x="180.0" y="414.0">desired vs. actual</text>
<text class="sub" x="180.0" y="430.0">only the differences</text>
<rect class="b ours" x="40" y="504" width="280" height="116" rx="12"/>
<text class="kick k-ours" x="180.0" y="525.0">5 · EXECUTE</text>
<text class="title" x="180.0" y="547.0">Execute</text>
<text class="sub" x="180.0" y="566.0">status, assignee, comments,</text>
<text class="sub" x="180.0" y="582.0">starts, add to board</text>
<text class="sub" x="180.0" y="598.0"><tspan class="mono">apply.py</tspan> <tspan class="mono">writer.py</tspan> <tspan class="mono">starter.py</tspan></text>
<rect class="b ours" x="350" y="504" width="280" height="116" rx="12"/>
<text class="kick k-ours" x="490.0" y="525.0">6 · NOTIFY</text>
<text class="title" x="490.0" y="547.0">Notify</text>
<text class="sub" x="490.0" y="566.0">Lead lines on stdout</text>
<text class="sub" x="490.0" y="582.0">already reported:</text>
<text class="sub" x="490.0" y="598.0"><tspan class="mono">cache/loop-state.json</tspan></text>
<rect class="b gh" x="685" y="344" width="190" height="116" rx="12"/>
<text class="kick k-gh" x="780.0" y="373.0">GITHUB</text>
<text class="title" x="780.0" y="395.0">GitHub</text>
<text class="sub" x="780.0" y="414.0">single source</text>
<text class="sub" x="780.0" y="430.0">of truth</text>
<rect class="b hm" x="685" y="504" width="190" height="116" rx="12"/>
<text class="kick k-hm" x="780.0" y="541.0">LEAD AGENT</text>
<text class="title" x="780.0" y="563.0">Lead</text>
<text class="sub" x="780.0" y="582.0">via Hermes delivery</text>
<path class="a" d="M180,104 V180" marker-end="url(#ma)"/>
<path class="a" d="M490,104 V122 H260 V180" marker-end="url(#ma)"/>
<path class="a" d="M320,242 H346" marker-end="url(#ma)"/>
<path class="a" d="M490,300 V340" marker-end="url(#ma)"/>
<path class="a" d="M350,402 H324" marker-end="url(#ma)"/>
<path class="a" d="M180,460 V500" marker-end="url(#ma)"/>
<path class="a" d="M320,562 H346" marker-end="url(#ma)"/>
<path class="a" d="M630,562 H681" marker-end="url(#ma)"/>
<path class="a" d="M630,226 H780 V340" marker-end="url(#ma)"/>
<text class="lbl halo" x="705" y="218">reads</text>
<path class="a" d="M290,504 V482 H780 V464" marker-end="url(#ma)"/>
<text class="lbl halo" x="560" y="476">writes</text>
</svg>
